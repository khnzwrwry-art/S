<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Launchpad — Business paths for teens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
 :root{--bg:#F3F4F7;--surface:#FFF;--surface-2:#ECEEF2;--text:#14171C;--text-muted:#565D6B;--border:#DDE0E6;--ink:#14171C;--ink-text:#F3F4F7;--shadow:0 1px 2px rgba(20,23,28,.06);--accent:#5B69C4;}
 @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151A;--surface:#1B1F26;--surface-2:#232830;--text:#F1F1EE;--text-muted:#A2A9B4;--border:#2A2F38;--ink:#F1F1EE;--ink-text:#14171C;--shadow:0 1px 2px rgba(0,0,0,.4);--accent:#93A0F0;}}
 :root[data-theme="dark"]{--bg:#12151A;--surface:#1B1F26;--surface-2:#232830;--text:#F1F1EE;--text-muted:#A2A9B4;--border:#2A2F38;--ink:#F1F1EE;--ink-text:#14171C;--shadow:0 1px 2px rgba(0,0,0,.4);--accent:#93A0F0;}
 *{box-sizing:border-box;}
 html,body{margin:0;padding:0;}
 body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;}
 h1,h2,h3{font-family:'Unbounded',system-ui,sans-serif;margin:0;letter-spacing:-.01em;}
 h4{font-family:'Unbounded';font-size:14px;font-weight:600;margin:0 0 8px;}
 #app{max-width:760px;margin:0 auto;padding:18px 16px 90px;}
 a{color:inherit;}
 :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px;}
 @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}
 button{font-family:'Inter';color:inherit;}

 .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px;}
 .brand{display:flex;align-items:center;gap:10px;cursor:pointer;background:none;border:none;padding:0;}
 .brand-mark{width:36px;height:36px;border-radius:11px;background:var(--ink);color:var(--ink-text);display:flex;align-items:center;justify-content:center;font-family:'Unbounded';font-weight:700;font-size:16px;}
 .brand-name{font-size:18px;font-weight:700;font-family:'Unbounded';}
 .back-btn{background:none;border:1px solid var(--border);padding:8px 13px;border-radius:20px;font-size:13.5px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;}
 .back-btn:hover{background:var(--surface-2);}

 .hero{margin-bottom:22px;}
 .hero h1{font-size:30px;line-height:1.18;font-weight:700;margin-bottom:10px;}
 .hero h1.sm{font-size:24px;}
 .hero p{color:var(--text-muted);font-size:15px;line-height:1.55;max-width:60ch;margin:0;}
 .muted-sm{font-size:13.4px;color:var(--text-muted);line-height:1.6;margin:0;}
 .muted-xs{font-size:12px;color:var(--text-muted);}
 .ml{margin-left:auto;}
 .cap{font-size:12.4px;color:var(--text-muted);line-height:1.55;margin:10px 0 0;}
 .link{text-decoration:underline;cursor:pointer;}

 .progress-strip{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px 15px;margin-bottom:16px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow);}
 .progress-strip .info b{font-size:14.5px;display:block;margin-bottom:2px;}
 .progress-strip .info span{font-size:12.5px;color:var(--text-muted);}
 .section-label{font-size:12.5px;color:var(--text-muted);font-weight:600;margin:26px 0 11px;font-family:'Inter';letter-spacing:0;}

 .nav-tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
 .tile{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px;cursor:pointer;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:9px;text-align:left;transition:border-color .15s;}
 .tile:hover{border-color:var(--text-muted);}
 .tile .g{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:#14171C;}
 .tile b{font-size:14.5px;display:block;margin-bottom:3px;}
 .tile span span{font-size:12.4px;color:var(--text-muted);line-height:1.45;display:block;}

 .grid{display:grid;grid-template-columns:1fr;gap:10px;}
 @media(min-width:600px){.grid{grid-template-columns:1fr 1fr;}}
 .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:15px;cursor:pointer;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;text-align:left;width:100%;transition:border-color .15s;}
 .card:hover{border-color:var(--text-muted);}
 .card-row{display:flex;align-items:center;justify-content:space-between;}
 .badge{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:#14171C;}
 .age-tag{font-size:11.5px;font-weight:600;color:var(--text-muted);border:1px solid var(--border);padding:3px 8px;border-radius:8px;}
 .card h3{font-size:16px;font-weight:600;margin:2px 0 4px;}
 .card p{margin:0;font-size:12.8px;color:var(--text-muted);line-height:1.5;}
 .card .w{display:block;}
 .mini-progress{height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden;display:block;}
 .mini-progress i{display:block;height:100%;border-radius:3px;}
 .mini-label{font-size:11.5px;color:var(--text-muted);margin-top:5px;display:block;}

 .cat-hero{margin-bottom:16px;}
 .badge-lg{width:54px;height:54px;border-radius:15px;margin-bottom:13px;}
 .cat-hero h1{font-size:25px;font-weight:700;margin-bottom:8px;}
 .cat-hero p{color:var(--text-muted);font-size:14.5px;line-height:1.55;max-width:60ch;margin:0;}
 .age-line{font-size:13px;margin-top:8px!important;}
 .tabs{display:flex;gap:18px;margin:18px 0;border-bottom:1px solid var(--border);}
 .tab{padding:10px 2px;background:none;border:none;border-bottom:2px solid transparent;margin-bottom:-1px;font-size:14px;font-weight:600;cursor:pointer;color:var(--text-muted);}
 .tab.active{color:var(--text);border-bottom-color:var(--text);}

 .panel{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:11px;box-shadow:var(--shadow);}
 .panel p{margin:0;font-size:14px;line-height:1.65;}
 .panel.warn{border-left:3px solid #E0A020;}
 .plat-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px;}
 .plat-top h4{margin:0;}
 .price-tag{font-size:11.5px;font-weight:600;color:var(--text-muted);border:1px solid var(--border);padding:3px 8px;border-radius:8px;white-space:nowrap;}
 .facts{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:11px;}
 .fact{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:13px;}
 .fact span{font-size:11.5px;color:var(--text-muted);display:block;margin-bottom:5px;font-weight:600;}
 .fact b{font-size:13.5px;line-height:1.45;display:block;}
 .flow{display:flex;flex-direction:column;align-items:center;}
 .flow svg{max-width:300px;}
 .viz{display:flex;justify-content:center;flex-direction:column;align-items:center;margin:12px 0 14px;}
 .lesson{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:11px;text-decoration:none;box-shadow:var(--shadow);}
 .lesson .play{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--ink);color:var(--ink-text);flex-shrink:0;}
 .lesson b{display:block;font-size:14px;margin-bottom:2px;}
 .lesson span span{font-size:12.5px;color:var(--text-muted);}

 .step{background:var(--surface);border:1px solid var(--border);border-radius:16px;margin-bottom:9px;overflow:hidden;}
 .step-head{display:flex;align-items:center;gap:11px;padding:13px 14px;cursor:pointer;}
 .step-check{width:24px;height:24px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--surface);cursor:pointer;}
 .step-check svg{display:none;}
 .step-check.done{border-color:transparent;}
 .step-check.done svg{display:block;}
 .step-num{font-size:11.5px;color:var(--text-muted);font-weight:700;width:16px;flex-shrink:0;}
 .step-title{flex:1;font-size:14.5px;font-weight:600;}
 .step-title.done{color:var(--text-muted);text-decoration:line-through;}
 .chev{color:var(--text-muted);transition:transform .15s;}
 .step.open .chev{transform:rotate(180deg);}
 .step-body{display:none;padding:0 15px 16px;}
 .step.open .step-body{display:block;}
 .step-body p{font-size:13.8px;line-height:1.65;margin:0 0 13px;}
 .row-links{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
 .pill{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;padding:8px 13px;border-radius:11px;border:1px solid var(--border);text-decoration:none;cursor:pointer;background:var(--surface);}
 .pill:hover{background:var(--surface-2);}
 .pill.cheer.on{border-color:var(--text);}
 .ai-tool{background:var(--surface-2);border-radius:12px;padding:12px 13px;display:flex;gap:10px;align-items:flex-start;}
 .ai-tool .dot{width:7px;height:7px;border-radius:50%;margin-top:6px;flex-shrink:0;}
 .ai-tool b{font-size:13px;display:block;margin-bottom:2px;}
 .ai-tool span span{font-size:12.8px;color:var(--text-muted);line-height:1.5;display:block;}

 .field-label{font-size:13.5px;font-weight:600;margin:0 0 8px;display:block;}
 textarea,input[type=text],select{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 13px;font-family:'Inter';font-size:14.5px;color:var(--text);margin-bottom:14px;}
 textarea{min-height:76px;resize:vertical;}
 .chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;}
 .chip{padding:8px 13px;border-radius:18px;border:1px solid var(--border);font-size:13px;font-weight:600;cursor:pointer;background:var(--surface);}
 .chip.active{background:var(--ink);color:var(--ink-text);border-color:var(--ink);}
 .btn-primary{background:var(--ink);color:var(--ink-text);border:none;border-radius:13px;padding:14px 20px;font-size:15px;font-weight:700;cursor:pointer;width:100%;}
 .btn-primary:disabled{opacity:.5;cursor:default;}
 .btn-ghost{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:12px 18px;font-size:14px;font-weight:600;cursor:pointer;}
 .btn-ghost.full{width:100%;margin-top:9px;}
 .result-box{margin-top:18px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:17px;white-space:pre-wrap;font-size:14.3px;line-height:1.7;}
 .hint{font-size:12.4px;color:var(--text-muted);margin-top:10px;line-height:1.55;}

 .chat-log{display:flex;flex-direction:column;gap:10px;margin-bottom:16px;}
 .msg{max-width:88%;padding:12px 14px;border-radius:16px;font-size:14.2px;line-height:1.65;white-space:pre-wrap;}
 .msg.user{align-self:flex-end;background:var(--ink);color:var(--ink-text);border-bottom-right-radius:5px;}
 .msg.bot{align-self:flex-start;background:var(--surface);border:1px solid var(--border);border-bottom-left-radius:5px;}
 .chat-input-row{display:flex;gap:8px;align-items:flex-end;}
 .chat-input-row textarea{margin-bottom:0;min-height:48px;}
 .send-btn{background:var(--ink);color:var(--ink-text);border:none;border-radius:12px;width:48px;height:48px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}

 .tpl{background:var(--surface);border:1px solid var(--border);border-radius:16px;margin-bottom:10px;overflow:hidden;box-shadow:var(--shadow);}
 .tpl-head{padding:14px 15px;cursor:pointer;display:flex;align-items:flex-start;gap:11px;}
 .tpl-head .n{font-family:'Unbounded';font-size:12px;font-weight:700;color:var(--text-muted);width:20px;flex-shrink:0;padding-top:2px;}
 .tpl-head b{display:block;font-size:14.8px;margin-bottom:3px;}
 .tpl-head span{font-size:12.5px;color:var(--text-muted);line-height:1.45;}
 .tpl-body{display:none;padding:0 15px 16px;}
 .tpl.open .tpl-body{display:block;}
 .beat{display:flex;gap:11px;padding:9px 0;border-bottom:1px solid var(--border);font-size:13.5px;line-height:1.55;}
 .beat:last-of-type{border-bottom:none;}
 .beat i{font-style:normal;font-weight:700;font-size:12px;color:var(--text-muted);flex-shrink:0;width:56px;}
 .script{background:var(--surface-2);border-radius:12px;padding:13px;font-size:13.5px;line-height:1.75;white-space:pre-wrap;margin:12px 0;}

 .glossary-item{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:13px 14px;margin-bottom:8px;}
 .glossary-item b{font-size:14px;display:block;margin-bottom:4px;}
 .glossary-item span{font-size:13.3px;color:var(--text-muted);line-height:1.6;}

 .quiz-q{margin:0 0 22px;border:none;padding:0;}
 .quiz-q legend{padding:0;margin-bottom:11px;}
 .quiz-q b{font-size:15.5px;}
 .quiz-opt{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:13px 14px;margin-bottom:8px;cursor:pointer;font-size:14px;}
 .quiz-opt.sel{border-color:var(--ink);background:var(--surface-2);}

 .post-top{display:flex;align-items:center;gap:9px;margin-bottom:9px;flex-wrap:wrap;}
 .post-tag{color:#14171C;font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:9px;}
 .post-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;}

 /* gate */
 #gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;}
 .gate-card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:26px 22px;box-shadow:var(--shadow);}
 .auth-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:13px;font-size:14.5px;font-weight:600;cursor:pointer;margin-bottom:9px;}
 .auth-btn:hover{background:var(--surface-2);}
 .auth-btn.sel{border-color:var(--ink);background:var(--surface-2);}
 .auth-btn .ai{font-weight:800;font-size:15px;}
 .divider{display:flex;align-items:center;gap:10px;margin:16px 0 14px;color:var(--text-muted);font-size:12.5px;}
 .divider:before,.divider:after{content:"";flex:1;height:1px;background:var(--border);}
 .agree{display:flex;gap:10px;align-items:flex-start;font-size:12.6px;line-height:1.55;color:var(--text-muted);margin-top:4px;}
 .agree input{margin-top:3px;flex-shrink:0;width:16px;height:16px;}
 [hidden]{display:none!important;}

 /* v5 polish */
 .hero{position:relative;}
 .hero-motif{position:absolute;top:-6px;left:-6px;opacity:.55;pointer-events:none;}
 .hero h1{position:relative;z-index:1;}
 .badge{position:relative;box-shadow:inset 0 -3px 6px rgba(0,0,0,.14),inset 0 2px 3px rgba(255,255,255,.25);}
 .badge-lg{box-shadow:inset 0 -4px 8px rgba(0,0,0,.16),inset 0 2px 4px rgba(255,255,255,.25);}
 .step-num{font-variant-numeric:tabular-nums;color:var(--accent);opacity:.75;}
 .tpl-head .n{font-variant-numeric:tabular-nums;}
 .tile{position:relative;overflow:hidden;}
 .tile .g{box-shadow:inset 0 -3px 6px rgba(0,0,0,.14),inset 0 2px 3px rgba(255,255,255,.25);}
 .card{position:relative;overflow:hidden;}
 .card:before{content:"";position:absolute;inset:0;border-radius:16px;background:linear-gradient(135deg,transparent 60%,rgba(0,0,0,.02));pointer-events:none;}
 .tpl-preview{display:flex;justify-content:center;margin:4px 0 16px;}
 .gate-card{position:relative;}
 .gate-card:before{content:"";position:absolute;top:0;left:0;right:0;height:4px;border-radius:22px 22px 0 0;background:linear-gradient(90deg,#FF6B4A,#F4B740,#2FB6A6,#4F9DDE,#9B8AFB,#EF6FA0);}
 .section-label{position:relative;padding-right:0;}
 .section-label:after{content:"";display:inline-block;width:22px;height:1px;background:var(--border);margin-right:8px;vertical-align:middle;}
</style>
</head>
<body>
<div id="gate"></div>
<div id="app" hidden>
 <header class="topbar">
  <button class="brand" id="brandHome" aria-label="Home"><span class="brand-mark">L</span><span class="brand-name">Launchpad</span></button>
  <button class="back-btn" id="backBtn" hidden><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>Back</button>
 </header>
 <main id="view-home"></main>
 <main id="view-category" hidden></main>
 <main id="view-content" hidden></main>
 <main id="view-assistant" hidden></main>
 <main id="view-templates" hidden></main>
 <main id="view-editing" hidden></main>
 <main id="view-visual" hidden></main>
 <main id="view-glossary" hidden></main>
 <main id="view-quiz" hidden></main>
 <main id="view-feed" hidden></main>
 <main id="view-ages" hidden></main>
 <main id="view-legal" hidden></main>
 <main id="view-terms" hidden></main>
 <main id="view-access" hidden></main>
</div>
<script>
const I={box:'<path d="M3 8l9-5 9 5-9 5-9-5z"/><path d="M3 8v8l9 5 9-5V8"/>',mega:'<path d="M3 11v2a2 2 0 002 2h1l3 5V4L6 9H5a2 2 0 00-2 2z"/><path d="M13 8a4 4 0 010 8"/>',cam:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7l2-3h4l2 3"/><circle cx="12" cy="13.5" r="3.5"/>',bag:'<path d="M6 8h12l1 12H5L6 8z"/><path d="M9 8V6a3 3 0 016 0v2"/>',shirt:'<path d="M8 4L3 7l2 3 2-1v11h10V9l2 1 2-3-5-3-1 2H9L8 4z"/>',case:'<rect x="3" y="8" width="18" height="11" rx="2"/><path d="M9 8V6a2 2 0 012-2h2a2 2 0 012 2v2"/><path d="M3 13h18"/>',chat:'<path d="M4 5h16v11H9l-5 4V5z"/><path d="M8 9h8M8 12h5"/>',book:'<path d="M4 5c3-1.5 6-1.5 8 0v14c-2-1.5-5-1.5-8 0V5z"/><path d="M20 5c-3-1.5-6-1.5-8 0v14c2-1.5 5-1.5 8 0V5z"/>',code:'<path d="M8 8l-4 4 4 4"/><path d="M16 8l4 4-4 4"/><path d="M13 5l-2 14"/>',spark:'<path d="M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2 2-6z"/>',play:'<circle cx="12" cy="12" r="10"/><path d="M10 8l6 4-6 4V8z"/>',film:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M8 5v14M16 5v14"/>',scissors:'<circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4L8.5 15.5M20 20L8.5 8.5"/>',bookmark:'<path d="M6 4h12v16l-6-4-6 4V4z"/>',shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3z"/>',compass:'<circle cx="12" cy="12" r="9"/><path d="M15 9l-2 5-5 2 2-5 5-2z"/>',access:'<circle cx="12" cy="4.5" r="2"/><path d="M5 8h14M12 8v6M12 14l-3 6M12 14l3 6"/>'};

const DATA=[
{id:'dropship',name:'Dropshipping',color:'#FF6B4A',icon:I.box,age:'16+',
 desc:'Sell products online without holding inventory — your supplier ships directly to the customer.',
 intro:{what:'You build an online store, list a supplier\'s products, and advertise them. When someone orders, your supplier ships the package straight to the buyer. You never touch the product or buy stock upfront.',
 money:'The gap between what the customer pays you and what the supplier charges, minus ad spend. A product that costs you $15 and sells for $39 leaves $24 gross — roughly half of that usually goes back into ads.',
 cost:'$50–$120 for month one: store subscription (free trial available) plus a small test ad budget.',
 time:'8–15 hours a week',
 income:'Most people make $0 for the first two months — that is the learning phase. Those who stick with it and learn to advertise typically reach $150–$800/month after six months. Very few go far beyond that, and not by accident.',
 risk:'The real danger is burning cash on ads with zero sales. Only spend what you are fully prepared to lose, and kill a campaign that is not working after three days.',
 fit:'Good for people curious about how advertising actually works, and willing to fail a few times first.',
 legal:'You are selling to real customers, so consumer protection law applies: accurate product descriptions, clear shipping times, and a written refund policy. Payment processors (Stripe, PayPal, Shopify Payments) require an account holder aged 18+ — under 18 this must run through a parent\'s account and, in most places, their business registration.'},
 videoUrl:'https://www.youtube.com/watch?v=snswA3W7Xac',
 platforms:[
  {n:'AutoDS',w:'All-in-one dropshipping automation: product research, auto price/stock updates, and automatic order fulfilment across suppliers.',u:'https://www.autods.com/',p:'Paid, free trial'},
  {n:'Shopify',w:'The store platform itself — checkout, payments, product pages and apps.',u:'https://www.shopify.com/',p:'Paid, free trial'},
  {n:'CJdropshipping',w:'Supplier network with warehouses worldwide, often faster shipping than ordering direct from marketplaces.',u:'https://cjdropshipping.com/',p:'Free to join'},
  {n:'Spocket',w:'Supplier marketplace focused on US and EU suppliers, so shipping takes days instead of weeks.',u:'https://www.spocket.co/',p:'Free tier'},
  {n:'DSers',w:'Order automation built around AliExpress suppliers.',u:'https://www.dsers.com/',p:'Free tier'},
  {n:'Meta Ads Manager',w:'Where you actually run Instagram and Facebook ads and read the results.',u:'https://business.facebook.com/',p:'Free tool, you pay for ads'},
  {n:'TikTok Ads Manager',w:'Ad platform where most teen-audience products are tested first.',u:'https://ads.tiktok.com/',p:'Free tool, you pay for ads'}],
 steps:[
  {title:'Find a niche and a product worth testing',text:'Look for a product that solves one small, real problem. Check demand on Google Trends and TikTok, and compare 3–5 suppliers before choosing. Shipping time matters more than price.',tool:'ChatGPT',toolUse:'Filters product ideas and analyses competitors in minutes',video:'how to find a winning dropshipping product'},
  {title:'Build your first store',text:'Keep it simple and clean. Focus everything on one product page that explains clearly why someone should buy from you: real photos, proof, and an honest returns policy.',tool:'Shopify Magic',toolUse:'Writes product descriptions and builds a sales page in seconds',video:'how to build a shopify store step by step'},
  {title:'Run your first ad campaign',text:'Install your tracking pixel, then run a small campaign on a low daily budget. The goal here is to learn what works, not to make a profit.',tool:'AdCreative.ai',toolUse:'Generates dozens of ad variations and shows which one wins',video:'first facebook ad campaign for dropshipping'},
  {title:'Deliver service and keep customers',text:'Reply fast, send shipping updates before people ask, and request a review after every good order. Reviews are what make your future ads cheaper.',tool:'Tidio AI',toolUse:'Chatbot that answers customers automatically around the clock',video:'ecommerce customer service automation'}]},

{id:'affiliate',name:'Affiliate Marketing',color:'#F4B740',icon:I.mega,age:'14+',
 desc:'Recommend other companies\' products and earn a commission on every sale through your link.',
 intro:{what:'You join a company\'s affiliate programme, get a personal tracking link, and recommend the product in your content. Anyone who buys through your link is credited to you and you earn a percentage. You never handle the product, shipping or support.',
 money:'Commission per sale — usually 3%–10% on physical products, and 20%–50% on digital products and courses.',
 cost:'$0. One social account is enough to start.',
 time:'5–10 hours a week',
 income:'Slow at the start: usually nothing for the first three months, because you need an audience first. People who publish consistently often reach $80–$500/month after a year.',
 risk:'Financial risk is near zero, but the real risk is trust: recommending a bad product for the commission burns the audience you spent months building.',
 fit:'Good if you enjoy making content and can wait months for the first result.',
 legal:'Disclosure is legally required in most countries (FTC rules in the US, similar rules elsewhere): every paid or commissioned recommendation must be clearly labelled. Most affiliate programmes also require members to be 18+, so under 18 you normally apply through a parent.'},
 videoUrl:'https://www.youtube.com/watch?v=Q17FB80ioA0',
 platforms:[
  {n:'Amazon Associates',w:'The easiest place to start — link to almost any product on Amazon.',u:'https://affiliate-program.amazon.com/',p:'Free'},
  {n:'Impact',w:'Large network connecting creators with well-known brands and higher commissions.',u:'https://impact.com/',p:'Free for partners'},
  {n:'ShareASale (Awin)',w:'Thousands of merchant programmes across most niches.',u:'https://www.shareasale.com/',p:'Free for partners'},
  {n:'Awin',w:'Global affiliate network, strong in Europe and the UK.',u:'https://www.awin.com/',p:'Free for partners'},
  {n:'CJ Affiliate',w:'One of the oldest networks, mostly bigger retail brands.',u:'https://www.cj.com/',p:'Free for partners'},
  {n:'ClickBank',w:'Digital products and courses with high commission rates.',u:'https://www.clickbank.com/',p:'Free'},
  {n:'PartnerStack',w:'Affiliate programmes for software and SaaS tools — recurring commissions.',u:'https://www.partnerstack.com/',p:'Free for partners'}],
 steps:[
  {title:'Pick a programme in your niche',text:'Choose a topic you genuinely know, then join a programme with a fair commission and a product you would recommend even without being paid.',tool:'Claude',toolUse:'Compares affiliate programmes and explains the terms in plain language',video:'how to choose affiliate programs beginners'},
  {title:'Build a content asset you own',text:'Start a channel, page or blog and publish consistently. This is what keeps sending people to your links months after you post.',tool:'Canva AI',toolUse:'Designs consistent templates for posts and thumbnails',video:'how to start a content channel from scratch'},
  {title:'Make honest recommendation content',text:'Show real use and say what is not great about the product too. Honest reviews convert far better than ads — and keep you out of trouble.',tool:'CapCut AI',toolUse:'Edits review videos quickly with automatic captions',video:'how to film a product review video'},
  {title:'Track conversions and double down',text:'Check which links and posts actually produce sales, then make more of that instead of trying everything.',tool:'ChatGPT',toolUse:'Analyses click and conversion data and suggests what to change',video:'how to track affiliate marketing performance'}]},

{id:'content',name:'Content Creation',color:'#2FB6A6',icon:I.cam,age:'13+ (with parent)',
 desc:'Build an audience around something you love, then earn from sponsorships, products or fan support.',
 intro:{what:'You pick a topic, publish consistently on one platform, and build an audience that comes back. The money does not come from the platform at first — it comes from the audience: sponsorships, your own product, affiliate links or memberships.',
 money:'Sponsored posts, affiliate commissions, your own digital product, and later platform ad revenue.',
 cost:'$0–$60. A phone, natural light, and eventually a cheap microphone.',
 time:'6–12 hours a week, consistently',
 income:'Usually nothing for the first six months. With a few thousand real followers in a focused niche, $50–$400 per sponsored post becomes realistic.',
 risk:'Burnout is the real danger — most people quit after a month of low views. Commit to a fixed posting schedule for three months before judging whether it works.',
 fit:'Good if you enjoy the making itself, not only the outcome.',
 legal:'Most platforms require account holders to be 13+, and 18+ for monetisation programmes and payouts — under 18 the payout account is usually a parent\'s. Sponsored content must be disclosed. Never use music, clips or images you do not have the rights to.'},
 videoUrl:'https://www.youtube.com/watch?v=wZILJ034PxA',
 platforms:[
  {n:'YouTube Studio',w:'Where you upload, read analytics and eventually enable monetisation.',u:'https://studio.youtube.com/',p:'Free'},
  {n:'TikTok Creator Center',w:'Trends, sounds and creator programmes in one place.',u:'https://www.tiktok.com/creators/creator-center/',p:'Free'},
  {n:'Instagram Creators',w:'Reels tools, insights and collaboration features.',u:'https://creators.instagram.com/',p:'Free'},
  {n:'CapCut',w:'The editor most short-form creators actually use — captions, trends, templates.',u:'https://www.capcut.com/',p:'Free tier'},
  {n:'Canva',w:'Thumbnails, covers and graphics without design skills.',u:'https://www.canva.com/',p:'Free tier'},
  {n:'Buffer',w:'Schedule posts across platforms so you publish on a fixed rhythm.',u:'https://buffer.com/',p:'Free tier'},
  {n:'Patreon',w:'Memberships and direct fan support once you have a real audience.',u:'https://www.patreon.com/',p:'Free, takes a cut'}],
 steps:[
  {title:'Choose a platform and a niche',text:'One platform, one clear topic. It is far easier to stand out in a narrow niche than to be another general channel.',tool:'Claude',toolUse:'Helps find an angle nobody else is covering',video:'how to choose a content niche'},
  {title:'Plan and film a week at a time',text:'Pick one filming day and shoot several videos back to back, so you are not chasing an idea every single day.',tool:'Notion AI',toolUse:'Builds a weekly content calendar with ready ideas',video:'weekly content batching for creators'},
  {title:'Edit fast with AI tools',text:'Cut silences, add captions, keep the pace tight. Good editing holds viewers far better than an expensive camera.',tool:'Descript',toolUse:'Edits video like a text document, removing filler words automatically',video:'fast video editing for beginners'},
  {title:'Build community, then monetise',text:'Reply to comments, ask your audience what they want, and only then add one income stream — sponsorship, product or affiliate.',tool:'ManyChat',toolUse:'Handles comments and DMs automatically at scale',video:'how creators make money from followers'}]},

{id:'apps',name:'App & Software Building',color:'#7C5CFF',icon:I.code,age:'14+ (16+ to publish)',
 desc:'Build apps, tools or small SaaS products — with AI you no longer need years of coding first.',
 intro:{what:'You build a real product: a mobile app, a web tool, a browser extension or a small SaaS. AI tools now let you go from idea to working prototype in days, even with limited coding experience. You make money from subscriptions, one-time purchases, ads, or by building apps for clients.',
 money:'Subscriptions (the strongest model), one-time purchase, in-app purchases, ads, or client work at a fixed project price.',
 cost:'$0–$120. Most build tools have free tiers; the real costs are the Apple developer account ($99/year) and Google Play ($25 one-time) if you publish to the stores.',
 time:'10–20 hours a week',
 income:'Client work pays fastest — $200–$1,500 per small project. Your own app usually earns nothing for months, then compounds: a tiny tool with 100 subscribers at $5/month is $500/month with almost no extra work.',
 risk:'The classic mistake is building for six months in secret and launching to silence. Show a rough version to real users in week one. Also watch running costs — a free app with heavy usage can start costing you money.',
 fit:'Good if you like solving problems, iterating, and seeing something you built get used.',
 legal:'App stores require developer account holders to be 18+ — under 18 you publish under a parent\'s developer account. If your app collects any user data you need a privacy policy, and stricter rules apply when your users are children (COPPA in the US, GDPR-K in the EU). Never ship code, assets or designs you copied from someone else.'},
 videoUrl:'https://www.youtube.com/watch?v=1rcSMm-gJSY',
 platforms:[
  {n:'Claude Code',w:'Build and edit real codebases by describing what you want in plain language.',u:'https://claude.com/product/claude-code',p:'Paid plan'},
  {n:'Lovable',w:'Describe a web app and get a working, editable React app you can deploy.',u:'https://lovable.dev/',p:'Free tier'},
  {n:'FlutterFlow',w:'Visual builder for real iOS and Android apps, with exportable code.',u:'https://www.flutterflow.io/',p:'Free tier'},
  {n:'Bubble',w:'No-code platform for full web apps with databases and user accounts.',u:'https://bubble.io/',p:'Free tier'},
  {n:'Glide',w:'Turns a spreadsheet into a usable app — the fastest way to ship a first version.',u:'https://www.glideapps.com/',p:'Free tier'},
  {n:'Supabase',w:'Database, authentication and storage for your app, without running a server.',u:'https://supabase.com/',p:'Free tier'},
  {n:'Firebase',w:'Google\'s backend: auth, database, hosting and analytics in one place.',u:'https://firebase.google.com/',p:'Free tier'},
  {n:'Vercel',w:'Deploy a web app to a real URL in minutes.',u:'https://vercel.com/',p:'Free tier'},
  {n:'GitHub',w:'Where your code lives, versioned and backed up. Essential from day one.',u:'https://github.com/',p:'Free'},
  {n:'Expo',w:'Build and test React Native mobile apps on your own phone.',u:'https://expo.dev/',p:'Free tier'},
  {n:'RevenueCat',w:'Handles in-app subscriptions and purchases across iOS and Android.',u:'https://www.revenuecat.com/',p:'Free under $2.5k/mo'},
  {n:'Apple Developer Program',w:'Required to publish on the App Store. Account holder must be 18+.',u:'https://developer.apple.com/programs/',p:'$99/year'},
  {n:'Google Play Console',w:'Required to publish on Google Play. Account holder must be 18+.',u:'https://play.google.com/console/',p:'$25 one-time'}],
 steps:[
  {title:'Find a problem you personally have',text:'The best first app solves something annoying in your own week — a tracker, a calculator, a tool your class needs. Do not start with "an app like Instagram but better".',tool:'Claude',toolUse:'Turns a vague idea into a defined feature list and a v1 scope',video:'how to come up with a good app idea'},
  {title:'Build a rough working version fast',text:'Aim for something usable in one week, not something finished. Ugly and working beats beautiful and imaginary.',tool:'Lovable / Claude Code',toolUse:'Builds a functioning prototype from a plain-language description',video:'build an app with AI in a week'},
  {title:'Put it in front of 10 real users',text:'Give it to ten people who actually have the problem and watch them use it without helping. Everything you need to fix will show up in those ten sessions.',tool:'Google Forms',toolUse:'Collects structured feedback you can actually act on',video:'how to get your first app users feedback'},
  {title:'Launch and charge money',text:'Publish it — store, web link or both — and add a price or subscription. Free users tell you what they like; paying users tell you what matters.',tool:'RevenueCat',toolUse:'Sets up subscriptions and purchases without building billing yourself',video:'how to launch your first app and monetize'}]},

{id:'ecommerce',name:'Your Own Product',color:'#4F9DDE',icon:I.bag,age:'16+',
 desc:'Design or make a product of your own and build a real brand around it.',
 intro:{what:'Unlike dropshipping, the product is yours: you design or make it, buy a small batch, and sell under your own name. Full control over quality, price and brand — and full responsibility too.',
 money:'Higher margins than dropshipping, typically 2.5–4× your production cost, because there is no middleman.',
 cost:'$150–$700 for a small first batch. That money goes out before any comes in.',
 time:'10–20 hours a week',
 income:'Highly variable. A good product with a precise audience can repay the batch in two months; an untested product sits in a box in your room.',
 risk:'The big one is buying stock before proving demand. Order the smallest batch the supplier allows, even if the unit price is worse.',
 fit:'Good if you have a specific product idea and patience for a longer process.',
 legal:'Selling physical goods brings product safety and labelling rules, especially for anything involving cosmetics, food, electronics or children\'s items. Business registration and sales tax handling are required in most places, which means a parent\'s registration if you are under 18.'},
 videoUrl:'https://www.youtube.com/watch?v=MZCWvhB5lic',
 platforms:[
  {n:'Shopify',w:'Your own branded store with payments built in.',u:'https://www.shopify.com/',p:'Paid, free trial'},
  {n:'Etsy',w:'Marketplace with built-in buyers for handmade and design products.',u:'https://www.etsy.com/sell',p:'Listing + transaction fees'},
  {n:'Alibaba',w:'Where most small-batch manufacturing starts. Always order a sample first.',u:'https://www.alibaba.com/',p:'Free to browse'},
  {n:'WooCommerce',w:'Free store software if you already have a WordPress site.',u:'https://woocommerce.com/',p:'Free core'},
  {n:'Looka',w:'Logo and brand kit generated in minutes.',u:'https://looka.com/',p:'Paid'},
  {n:'Stripe',w:'Payment processing for your own site. Account holder must be 18+.',u:'https://stripe.com/',p:'Per transaction'}],
 steps:[
  {title:'Design or make your product',text:'Start with one simple version. Order a single sample and hold it in your hands before anything else — most problems only show up physically.',tool:'Midjourney',toolUse:'Visualises product concepts before you commit to production',video:'how to develop a product from scratch'},
  {title:'Build a brand and a store',text:'Name, logo, one consistent voice. Tell the story behind the product — that is what separates a brand from another shop.',tool:'Looka',toolUse:'Generates a logo and basic brand kit in minutes',video:'how to build a brand for a small business'},
  {title:'Shoot content and sell socially',text:'Film the product in real use, not just on a white background. Real footage stops the scroll far more reliably.',tool:'CapCut AI',toolUse:'Edits short, punchy product content for social platforms',video:'how to shoot product content for social media'},
  {title:'Manage stock and shipping',text:'Track quantities and lead times, and never sell what you do not have. One late order creates a review that stays forever.',tool:'Claude',toolUse:'Builds a simple inventory and order tracking sheet',video:'inventory management for small business'}]},

{id:'pod',name:'Print on Demand',color:'#9B8AFB',icon:I.shirt,age:'15+',
 desc:'Design prints for shirts, mugs and posters — each item is made only after someone buys it.',
 intro:{what:'You upload a design, the platform puts it on products, and when someone orders, the platform prints and ships it. You handle design and marketing only.',
 money:'The gap between your selling price and the printing cost. A shirt costing $12 to print and selling for $28 leaves $16 before advertising.',
 cost:'$0–$40. Uploading is free; the only real cost is advertising if you choose to run it.',
 time:'5–10 hours a week',
 income:'Usually a few scattered sales at first. Finding one precise audience — a hobby, a community, an inside joke — is what turns it into $80–$400/month.',
 risk:'Financial risk is low, but legal risk is real: using characters, logos or images you do not own is the number one reason accounts get shut down.',
 fit:'Good if you like designing and have a recognisable sense of humour or style.',
 legal:'Copyright and trademark law is the whole game here. Fan art, band logos, movie quotes and sports team names are almost always protected. Design only original work, or use assets with a licence that explicitly allows commercial use.'},
 videoUrl:'https://www.youtube.com/watch?v=zpj8jIRQxTk',
 platforms:[
  {n:'Printful',w:'Connects to your store, prints and ships automatically. Strong quality.',u:'https://www.printful.com/',p:'Free to join'},
  {n:'Printify',w:'Network of print providers, usually cheaper with more product choice.',u:'https://printify.com/',p:'Free tier'},
  {n:'Redbubble',w:'Marketplace with its own traffic — upload designs and people find them.',u:'https://www.redbubble.com/',p:'Free'},
  {n:'Teespring (Spring)',w:'Built for creators selling merch to an existing audience.',u:'https://www.spri.ng/',p:'Free'},
  {n:'Etsy',w:'Pairs well with Printful for handmade-style designs.',u:'https://www.etsy.com/sell',p:'Fees per listing'},
  {n:'Canva',w:'Where most first designs get made.',u:'https://www.canva.com/',p:'Free tier'}],
 steps:[
  {title:'Design a print for a specific audience',text:'Pick a narrow group and design something only they would understand. Generic designs do not sell.',tool:'Midjourney',toolUse:'Generates original design concepts and illustrations quickly',video:'how to design t shirts that sell'},
  {title:'Connect a print-on-demand platform',text:'Link your store to a printer that produces and ships automatically, and order one sample to check the print quality yourself.',tool:'Printful',toolUse:'Handles production and shipping without you touching anything',video:'how to connect printful to your store'},
  {title:'Market with real photos',text:'Photograph friends wearing it. Computer mockups look like mockups and convert worse.',tool:'CapCut',toolUse:'Creates short content showing the product being worn',video:'how to market print on demand products'},
  {title:'Keep what sells, expand it',text:'Drop the designs that do not move and make variations of the ones that do, instead of inventing something new every time.',tool:'ChatGPT',toolUse:'Analyses which designs sell and why',video:'scaling a print on demand business'}]},

{id:'freelance',name:'Freelancing',color:'#EF6FA0',icon:I.case,age:'14+ (16+ on most platforms)',
 desc:'Sell a skill — editing, design, writing, code — with zero money upfront.',
 intro:{what:'You sell your time and skill: video editing, graphic design, writing, web building, ad management. The client pays for a defined result.',
 money:'Per project or per hour. Per project is better — as you get faster, you earn more for the same time.',
 cost:'$0. A computer and free tools are enough.',
 time:'Fully flexible — 4 hours a week is a real start',
 income:'This is the fastest path to actual money. A first client within two weeks is realistic, and $300–$1,200/month after a few months is normal.',
 risk:'Clients who do not pay, or who ask for endless revisions. Agree in writing up front: what is included, how many revisions, and when payment happens.',
 fit:'Good if you are already decent at something and want to see money in the short term.',
 legal:'Most freelance platforms require members to be 18+ (some allow 16+ with parental consent) — check before building a profile. Freelance income is taxable income in almost every country, and under 18 it usually has to be handled through a parent. Always use a simple written agreement.'},
 videoUrl:'https://www.youtube.com/watch?v=m97fJxWwiMQ',
 platforms:[
  {n:'Fiverr',w:'Sell packaged services; buyers come to you. Easiest place to get a first review.',u:'https://www.fiverr.com/',p:'Free, takes a cut'},
  {n:'Upwork',w:'Bigger projects and longer client relationships.',u:'https://www.upwork.com/',p:'Free, takes a cut'},
  {n:'Contra',w:'Commission-free freelance platform with a portfolio built in.',u:'https://contra.com/',p:'Free'},
  {n:'Behance',w:'Portfolio site designers and editors actually get hired from.',u:'https://www.behance.net/',p:'Free'},
  {n:'Canva',w:'Design delivery for clients without expensive software.',u:'https://www.canva.com/',p:'Free tier'},
  {n:'Wave',w:'Free invoicing so you look professional and get paid on time.',u:'https://www.waveapps.com/',p:'Free invoicing'}],
 steps:[
  {title:'Pick one skill you already have',text:'Choose the thing you are already good at and turn it into a defined offer: exactly what is included, how long it takes, what it costs.',tool:'Claude',toolUse:'Defines a service package and a sensible beginner price',video:'how to choose a freelance service to sell'},
  {title:'Build a portfolio fast',text:'No clients yet? Make three samples of your own. Nobody asks whether it was a paid job — they ask whether it is good.',tool:'Canva AI',toolUse:'Builds a presentable portfolio in about an hour',video:'how to build a portfolio with no experience'},
  {title:'Land the first client',text:'Message small businesses you already know and offer a starter price in exchange for an honest review. Direct outreach beats posting and waiting.',tool:'ChatGPT',toolUse:'Writes a short outreach message and a simple quote',video:'how to get your first freelance client'},
  {title:'Collect reviews and raise prices',text:'Ask for a written review after every good job. Three reviews let you raise your price without apologising.',tool:'Claude',toolUse:'Drafts a review request and a pricing ladder as you gain experience',video:'how to price freelance services'}]},

{id:'social',name:'Social Media Management',color:'#A8C94A',icon:I.chat,age:'16+',
 desc:'Run social accounts for small businesses on a fixed monthly fee.',
 intro:{what:'Small businesses know they need to post but have no time or skill. You handle it: filming, writing, designing and publishing consistently, for a monthly fee.',
 money:'A monthly retainer — typically $200–$700 per client depending on how much content you produce.',
 cost:'$0. A phone and free design tools are enough.',
 time:'4–8 hours a week per client',
 income:'Predictable and recurring, which is the real advantage. Two steady clients is already $400–$1,200/month.',
 risk:'Promising results you cannot control. Sell consistent, quality content — not a follower count.',
 fit:'Good if you are comfortable talking to business owners and meeting deadlines.',
 legal:'You are handling someone else\'s brand accounts: agree in writing on access, approvals and what happens to the accounts if you stop working together. Never buy followers or engagement — it breaches platform terms and can get the client\'s account penalised.'},
 videoUrl:'https://www.youtube.com/watch?v=y-n1RUbYq6Q',
 platforms:[
  {n:'Meta Business Suite',w:'Manage and schedule Instagram and Facebook for clients from one place.',u:'https://business.facebook.com/',p:'Free'},
  {n:'Buffer',w:'Simple scheduling across platforms with clear reporting.',u:'https://buffer.com/',p:'Free tier'},
  {n:'Later',w:'Visual planner built for Instagram-first clients.',u:'https://later.com/',p:'Free tier'},
  {n:'Metricool',w:'Analytics and reports that make monthly client updates easy.',u:'https://metricool.com/',p:'Free tier'},
  {n:'Canva',w:'Client-ready post design at speed.',u:'https://www.canva.com/',p:'Free tier'},
  {n:'Notion',w:'Content calendars clients can review and approve.',u:'https://www.notion.com/',p:'Free tier'}],
 steps:[
  {title:'Choose the type of business you serve',text:'Pick one category — cafés, barbers, gyms — and learn it deeply. Specialising builds trust much faster.',tool:'Claude',toolUse:'Audits existing accounts and identifies what is missing',video:'how to find social media management clients'},
  {title:'Prepare a pitch and sample work',text:'Make three sample posts for a real business before they ask. It is the fastest way to get a first meeting.',tool:'Canva AI',toolUse:'Designs professional-looking posts quickly',video:'social media proposal for clients'},
  {title:'Plan a month of content',text:'Build a monthly calendar the client approves in advance. It prevents arguments and shows there is a system.',tool:'Notion AI',toolUse:'Builds a content calendar and publishing schedule',video:'how to plan a monthly content calendar'},
  {title:'Report results and keep the client',text:'Send a short monthly summary: what was posted, what performed best, what is next. Consistent reporting is what keeps a retainer alive.',tool:'ChatGPT',toolUse:'Writes a short, clear monthly performance report',video:'social media client reporting'}]},

{id:'courses',name:'Digital Products & Courses',color:'#6C7BD1',icon:I.book,age:'15+',
 desc:'Turn something you already know into a guide you can sell again and again.',
 intro:{what:'You take something you already know — guitar, editing, maths, gaming — and turn it into a structured guide or mini-course. You make it once and sell it indefinitely.',
 money:'Direct sales of a digital product. No production cost per sale, so almost the entire price stays with you.',
 cost:'$0–$30. Screen recording plus a sales platform that takes a small cut.',
 time:'15–30 hours to build, then very little',
 income:'Depends entirely on audience. With no audience, sales are near zero; with a small loyal one, $150–$700/month is realistic.',
 risk:'The classic mistake is spending six months building a huge course nobody wants. Sell first, build second.',
 fit:'Good if you already explain things to people easily.',
 legal:'You must own everything in the course — no copied slides, images, music or text. If you make claims about results, they need to be honest. Payout accounts on most platforms require the holder to be 18+.'},
 videoUrl:'https://www.youtube.com/watch?v=ccIWfbIXSGU',
 platforms:[
  {n:'Gumroad',w:'The simplest way to sell a digital file and get paid.',u:'https://gumroad.com/',p:'Free, takes a cut'},
  {n:'Payhip',w:'Sell ebooks, courses and memberships with a free plan.',u:'https://payhip.com/',p:'Free tier'},
  {n:'Teachable',w:'Full course platform with lessons, quizzes and student progress.',u:'https://teachable.com/',p:'Free tier'},
  {n:'Podia',w:'Courses, downloads and email marketing in one place.',u:'https://www.podia.com/',p:'Paid, free trial'},
  {n:'Notion',w:'Build and structure the course content itself.',u:'https://www.notion.com/',p:'Free tier'},
  {n:'OBS Studio',w:'Free screen recording for lessons.',u:'https://obsproject.com/',p:'Free'}],
 steps:[
  {title:'Pick a topic you actually know',text:'Choose something people have asked you about more than once. A repeated question is the clearest signal of demand.',tool:'Claude',toolUse:'Maps your topic into clear, ordered lessons',video:'how to choose a course topic'},
  {title:'Build a short, focused version',text:'One to two hours of content solving one problem. A giant course intimidates both you and the buyer.',tool:'Notion AI',toolUse:'Organises your material into a clear course structure',video:'how to build a mini course'},
  {title:'Launch and sell it',text:'Put it on a sales platform and write a page that says exactly what the learner will be able to do at the end. That is what sells.',tool:'Gumroad',toolUse:'Hosts the product and handles payment for you',video:'how to sell a digital product online'},
  {title:'Collect feedback and improve',text:'Ask your first ten buyers what was clear and what was not, then update. Version two sells far better.',tool:'ChatGPT',toolUse:'Turns scattered feedback into an ordered improvement list',video:'how to improve an online course'}]},
{id:'websites',name:'Website Building for Businesses',color:'#2FA88A',icon:I.code,age:'15+',
 desc:'Build simple websites for local businesses that don\'t have one yet, using AI website builders instead of coding by hand.',
 intro:{what:'Millions of small businesses — a barber, a tutor, a local bakery — still have no website or a badly outdated one. You use AI website builders to produce a clean, working site in hours instead of weeks, then sell the finished result (and often ongoing hosting/updates) to the business owner.',
 money:'A one-time build fee per site ($150–$800 depending on complexity), often plus a small monthly fee for hosting and updates ($20–$60/month) — which turns into recurring income across multiple clients.',
 cost:'$0–$30/month. Most AI website builders have a free tier to build and demo; a paid plan is usually needed only once a client says yes.',
 time:'5–10 hours per site once you have a repeatable process',

let feedPosts=[],feedFilter='all',feedSearch='',feedSort='new',feedDb=null,feedUser=null,myId=null,nameCache={};
async function initFeed(){
 if(feedDb!==null)return;
 feedDb=await claude.use('db');feedUser=await claude.use('user');
 if(feedUser){try{myId=await feedUser.id();}catch(e){}}
 if(!feedDb)return;
 try{feedDb.collection('posts').orderBy('createdAt','desc').limit(100).onSnapshot(function(snap){
  feedPosts=snap.docs.map(function(d){var o=Object.assign({},d.data()||{});o._id=d.id;return o;});
  resolveNames();renderFeedList();
 },function(){renderFeedList();});}catch(e){}
}
async function resolveNames(){
 if(!feedUser)return;
 var ids=feedPosts.map(function(p){return p.authorId;}).filter(function(x){return x&&!(x in nameCache);});
 if(!ids.length)return;
 try{var ps=await feedUser.profiles(Array.from(new Set(ids)));
  Object.keys(ps||{}).forEach(function(k){nameCache[k]=(ps[k]&&ps[k].name)||'';});renderFeedList();}catch(e){}
}

 '<h2 class="section-label">Filter</h2>'+
 '<label class="field-label" for="feedSearch">Search posts</label>'+
 '<input type="text" id="feedSearch" placeholder="Search the feed..." value="'+esc(feedSearch)+'">'+
 '<div class="chip-row" id="feedChips"></div>'+
 '<div class="chip-row"><button class="chip '+(feedSort==='new'?'active':'')+'" data-sort="new">Newest</button><button class="chip '+(feedSort==='top'?'active':'')+'" data-sort="top">Most cheered</button></div>'+
 '<div id="feedList"><p class="hint">Loading the feed...</p></div>';
 renderComposer();renderFeedChips();renderFeedList();
 document.getElementById('feedSearch').oninput=function(e){feedSearch=e.target.value;renderFeedList();};
 document.querySelectorAll('[data-sort]').forEach(function(c){c.onclick=function(){feedSort=c.dataset.sort;renderFeed();};});
 initFeed().then(renderFeedList);
}
function renderFeedChips(){
 var el=document.getElementById('feedChips');
 el.innerHTML='<button class="chip '+(feedFilter==='all'?'active':'')+'" data-f="all">All</button>'+
 DATA.map(function(c){return '<button class="chip '+(feedFilter===c.id?'active':'')+'" data-f="'+c.id+'">'+c.name+'</button>';}).join('');
 el.querySelectorAll('[data-f]').forEach(function(c){c.onclick=function(){feedFilter=c.dataset.f;renderFeedChips();renderFeedList();};});
}
function renderComposer(){
 document.getElementById('composer').innerHTML=
 '<div class="panel"><h4>Share your progress</h4>'+
 '<label class="field-label" for="postBiz">Business type</label><select id="postBiz">'+DATA.map(function(c){return '<option value="'+c.id+'">'+c.name+'</option>';}).join('')+'</select>'+
 '<label class="field-label" for="postMilestone">Milestone</label><select id="postMilestone">'+MILESTONES.map(function(m){return '<option>'+m+'</option>';}).join('')+'</select>'+
 '<label class="field-label" for="postText">What happened</label><textarea id="postText" placeholder="What worked this week, what did not, and where you are stuck"></textarea>'+
 '<button class="btn-primary" id="postBtn">Post to the feed</button><p class="hint" id="postHint"></p></div>';
 document.getElementById('postBtn').onclick=submitPost;
}
async function submitPost(){
 var hint=document.getElementById('postHint'),text=document.getElementById('postText').value.trim();
 if(text.length<5){hint.textContent='Write at least a sentence.';return;}
 if(text.length>600){hint.textContent='Keep it under 600 characters.';return;}
 var btn=document.getElementById('postBtn');btn.disabled=true;hint.textContent='Posting...';
 await initFeed();
 if(!feedDb){hint.textContent='The feed is not available in this view.';btn.disabled=false;return;}
 try{
  await feedDb.collection('posts').add({authorId:myId||'anon',businessId:document.getElementById('postBiz').value,
   milestone:document.getElementById('postMilestone').value,text:text,cheers:{},createdAt:Date.now()});
  document.getElementById('postText').value='';hint.textContent='Posted.';
 }catch(e){hint.textContent=(e&&e.code==='invalid_argument')?'You do not have permission to post in this view.':'Posting failed, try again.';}
 btn.disabled=false;
}
function cheerCount(p){return p.cheers?Object.keys(p.cheers).length:0;}
function renderFeedList(){
 var el=document.getElementById('feedList');if(!el)return;
 if(feedDb===null){el.innerHTML='<p class="hint">Loading the feed...</p>';return;}
 if(!feedDb){el.innerHTML='<p class="hint">The feed is not available in this view.</p>';return;}
 var q=feedSearch.trim().toLowerCase();
 var list=feedPosts.filter(function(p){
  if(feedFilter!=='all'&&p.businessId!==feedFilter)return false;
  if(q&&(String(p.text)+' '+String(p.milestone)).toLowerCase().indexOf(q)===-1)return false;
  return true;});
 if(feedSort==='top')list=list.slice().sort(function(a,b){return cheerCount(b)-cheerCount(a);});
 if(!list.length){el.innerHTML='<p class="hint">No posts here yet. Be the first.</p>';return;}
 el.innerHTML=list.map(function(p){
  var cat=DATA.find(function(c){return c.id===p.businessId;})||{name:'General',color:'#6C7BD1'};
  var nm=nameCache[p.authorId]||'Someone in the community';
  var mine=p.cheers&&myId&&p.cheers[myId];
  return '<div class="panel"><div class="post-top">'+
  '<span class="post-tag" style="background:'+cat.color+'">'+cat.name+'</span>'+
  '<span class="muted-xs">'+esc(p.milestone||'')+'</span>'+
  '<span class="muted-xs ml">'+timeAgo(p.createdAt)+'</span></div>'+
  '<p style="font-size:14px;margin:0 0 10px">'+esc(p.text)+'</p>'+
  '<div class="post-foot"><span class="muted-xs">'+esc(nm)+'</span>'+
  '<button class="pill cheer '+(mine?'on':'')+'" data-cheer="'+p._id+'">🔥 '+cheerCount(p)+'</button></div></div>';
 }).join('');
 el.querySelectorAll('[data-cheer]').forEach(function(b){b.onclick=function(){cheer(b.dataset.cheer);};});
}
async function cheer(id){
 if(!feedDb||!myId)return;
 var p=feedPosts.find(function(x){return x._id===id;});if(!p)return;
 var c=Object.assign({},p.cheers||{});
 if(c[myId])delete c[myId];else c[myId]=true;
 try{await feedDb.doc('posts/'+id).update({cheers:c});}catch(e){}
}
function timeAgo(ts){
 if(!ts)return '';var m=Math.floor((Date.now()-ts)/60000);
 if(m<1)return 'just now';if(m<60)return m+'m ago';
 var h=Math.floor(m/60);if(h<24)return h+'h ago';
 return Math.floor(h/24)+'d ago';
}

/* ---------- init ---------- */
document.getElementById('backBtn').onclick=function(){go('home');};
document.getElementById('brandHome').onclick=function(){go('home');};
checkAuthAndEnter();
showView('home');

</script>
</body>
