<!doctype html>
<html><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#fff;font-family:Inter,system-ui,sans-serif}
#card{width:1600px;height:900px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center}
#card .blob{position:absolute;border-radius:50%}
h1{font-size:72px;font-weight:800;letter-spacing:-2px;text-align:center;color:#2A211C;margin-bottom:70px;position:relative}
.row{display:flex;justify-content:center;align-items:flex-start;position:relative;padding:0 20px}
.step{width:352px;display:flex;flex-direction:column;align-items:center;text-align:center}
.ic{width:250px;height:250px;border-radius:50%;border:7px solid #2A211C;display:flex;align-items:center;justify-content:center;position:relative;background:#fff}
.ic svg{width:132px;height:132px}
.num{position:absolute;top:-6px;left:-6px;width:78px;height:78px;border-radius:50%;background:#EA580C;border:7px solid #2A211C;color:#fff;font-weight:800;font-size:40px;display:flex;align-items:center;justify-content:center}
.lab{margin-top:40px;font-size:44px;line-height:1.18;font-weight:700;color:#2A211C;letter-spacing:-.5px;max-width:352px;text-wrap:balance}
.arrow{width:44px;height:250px;display:flex;align-items:center;justify-content:center;flex:none}
.arrow svg{width:42px;height:32px}
</style></head><body>
<div id="card"></div>
<script>
const INK='#2A211C';
const BIZ={dropship:'#FF6B4A',affiliate:'#F4B740',content:'#2FB6A6',apps:'#7C5CFF',ecommerce:'#4F9DDE',
 pod:'#9B8AFB',freelance:'#EF6FA0',social:'#A8C94A',courses:'#6C7BD1',websites:'#2FA88A'};
function hex(c){return [1,3,5].map(i=>parseInt(c.slice(i,i+2),16));}
function mix(a,b,t){const A=hex(a),B=hex(b);return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('');}
const P=d=>`<path d="${d}"/>`, C=(x,y,r)=>`<circle cx="${x}" cy="${y}" r="${r}"/>`, R=(x,y,w,h,r)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r||0}"/>`;

 doc:P('M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z')+P('M14 2v6h6M8 13h8M8 17h5'),
 pen:P('M12 20h9')+P('M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z'),
 chat:P('M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z'),

 people:C(9,8,3.5)+P('M2 20a7 7 0 0 1 14 0')+C(17.5,9,2.5)+P('M18 14a4.5 4.5 0 0 1 4 5'),
 shield:P('M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z')+P('M9 12l2 2 4-4'),
 eye:P('M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z')+C(12,12,3),

 calc:R(5,2,14,20,2)+R(8,5,8,4,1)+P('M8.5 13h.01M12 13h.01M15.5 13h.01M8.5 17h.01M12 17h.01M15.5 17h.01'),
 ban:C(12,12,9)+P('M5.6 5.6l12.8 12.8'),

 lock:R(4,11,16,10,2)+P('M8 11V7a4 4 0 0 1 8 0v4'),
 tag:P('M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L2 12V2h10l8.6 8.6a2 2 0 0 1 0 2.8z')+P('M7 7h.01'),
 flag:P('M4 22V3')+P('M4 4h14l-3 4.5 3 4.5H4'),
 scale:P('M12 3v18M7 21h10M5 7h14')+P('M5 7l-3 7a3 3 0 0 0 6 0z')+P('M19 7l-3 7a3 3 0 0 0 6 0z'),
 phone:R(6,2,12,20,2.5)+P('M11 18h2'),
 calendar:R(3,5,18,16,2)+P('M3 10h18M8 3v4M16 3v4'),
 link:P('M10 13a5 5 0 0 0 7.1 0l3-3a5 5 0 0 0-7.1-7.1l-1.2 1.2')+P('M14 11a5 5 0 0 0-7.1 0l-3 3a5 5 0 0 0 7.1 7.1l1.2-1.2'),
 megaphone:P('M3 11v2a1 1 0 0 0 1 1h2l6 4V6L6 10H4a1 1 0 0 0-1 1z')+P('M16 9a4 4 0 0 1 0 6M19 6a8 8 0 0 1 0 12'),
 list:P('M9 6h12M9 12h12M9 18h12M4 6h.01M4 12h.01M4 18h.01'),
 refresh:P('M21 12a9 9 0 0 1-15.5 6.3L3 16')+P('M3 12a9 9 0 0 1 15.5-6.3L21 8')+P('M21 3v5h-5M3 21v-5h5'),
 id:R(3,5,18,14,2)+C(9,11,2)+P('M6 16a3 3 0 0 1 6 0M15 10h3M15 14h3'),
 bank:P('M3 21h18M4 10h16M12 3l9 5H3z')+P('M6 10v8M10 10v8M14 10v8M18 10v8'),
 family:C(8,6,3)+P('M3 21v-2.5a5 5 0 0 1 10 0V21')+C(17,10.5,2.2)+P('M14 21v-1.5a3 3 0 0 1 6 0V21'),
 piggy:P('M19 11c0-3.3-3.1-6-7-6S5 7.7 5 11c0 1.6.7 3 1.9 4l.6 4h3v-2h3v2h3l.5-3.2c1.4-.9 2-2.3 2-3.8z')+P('M5 10.5C3 10.5 2 9.5 2 8M15 9.5h.01M10 8h4'),

 laptop:R(4,4,16,11,1.5)+P('M2 19h20M5 15l-2 4M19 15l2 4'),

 code:P('M8 7l-5 5 5 5M16 7l5 5-5 5M14 4l-4 16'),

 check:C(12,12,9)+P('M8 12.5l3 3 5-6'),
 mic:R(9,2,6,12,3)+P('M5 11a7 7 0 0 0 14 0M12 18v4M8 22h8'),
 image:R(3,3,18,18,2)+C(9,9,2)+P('M21 15l-5-5L5 21'),
 cart:C(9,20,1.5)+C(18,20,1.5)+P('M2 3h3l2.7 12.4a2 2 0 0 0 2 1.6h8.6a2 2 0 0 0 2-1.6L22 7H6'),

 browser:R(3,4,18,16,2)+P('M3 9h18M6.5 6.5h.01M9 6.5h.01'),

 mail:R(2,4,20,16,2)+P('M22 6l-10 7L2 6'),
 play:C(12,12,9)+P('M10 8l6 4-6 4z'),
 camera:P('M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z')+C(12,13,3.5),
};
const icon=k=>{if(!ICONS[k])throw new Error('no icon '+k);return `<svg viewBox="0 0 24 24" fill="none" stroke="${INK}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${ICONS[k]}</svg>`;};
const arrow=c=>`<div class="arrow"><svg viewBox="0 0 56 40"><path d="M4 20h40" stroke="${INK}" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 12"/><path d="M34 8l14 12-14 12" fill="none" stroke="${INK}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>`;
function render(biz,steps,title){
 const c=BIZ[biz], light=mix(c,'#FBF8F2',.84), soft=mix(c,'#FFFFFF',.55), fills=[mix(c,'#FFFFFF',.55),mix(c,'#FFFFFF',.35),mix(c,'#FFFFFF',.15),c];
 const el=document.getElementById('card');
 el.style.background=light;
 el.innerHTML=`<div class="blob" style="width:520px;height:520px;left:-160px;top:-200px;background:${soft};opacity:.5"></div>
  <div class="blob" style="width:620px;height:620px;right:-200px;bottom:-300px;background:${soft};opacity:.5"></div>
  ${title?`<h1>${title}</h1>`:''}
  <div class="row">${steps.map((s,i)=>(i?arrow(c):'')+`<div class="step"><div class="ic" style="background:${fills[i]}">${icon(s[1])}<div class="num">${i+1}</div></div><div class="lab">${s[0]}</div></div>`).join('')}</div>`;
 // shrink any label that wraps to more than 2 lines
 el.querySelectorAll('.lab').forEach(l=>{let f=44;while(l.scrollHeight>l.clientHeight+1&&false){} while(l.offsetHeight>2*44*1.18+4&&f>30){f-=2;l.style.fontSize=f+'px';}});
 return [...el.querySelectorAll('.lab')].map(l=>l.offsetHeight);
}
window.render=render;
</script></body></html>
